services:
  ollama:
    image: ollama/ollama:latest
    container_name: homelab-slm-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ../notebooks/fine_tuning:/fine_tuning:ro
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      # Semantic search keeps a chat model and an embedding model resident.
      # With 1 loaded model, every Embed Termo call evicts qwen3:4b.
      - OLLAMA_MAX_LOADED_MODELS=2
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '6.0'
        reservations:
          memory: 1024M
    networks:
      - lab-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: homelab-slm-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-orcamento_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      - lab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orcamento_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Isolated vector store for the semantic-search workflow. It is deliberately
  # separate from `postgres`: the 1,560-row embedding index can be rebuilt or
  # dropped without touching the budget tables.
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: homelab-slm-pgvector
    restart: unless-stopped
    ports:
      - "${PGVECTOR_PORT:-5434}:5432"
    environment:
      - POSTGRES_DB=${PGVECTOR_DB:-natureza_vectors}
      - POSTGRES_USER=${PGVECTOR_USER:-natureza}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:-natureza}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    networks:
      - lab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  n8n:
    image: n8nio/n8n:latest
    container_name: homelab-slm-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${WEBHOOK_URL:-http://homelab.local:5678/}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_AI_ENABLED=true
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n_workflows:/workflows:ro
      # Read-only source for the semantic-search workflow and its credential.
      - ./semantic_search:/semantic_search:ro
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '2.0'
        reservations:
          memory: 256M
    networks:
      - lab-network

  # One-shot ingestion job. It is behind the `setup` profile so `make up` does
  # not start it; run it with `make semantic-ingest` or `make semantic-setup`.
  semantic-ingest:
    profiles: ["setup"]
    restart: "no"
    build:
      context: ./semantic_search
      dockerfile: ingest/Dockerfile
    depends_on:
      pgvector:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      - PGVECTOR_HOST=pgvector
      - PGVECTOR_PORT=5432
      - PGVECTOR_DB=${PGVECTOR_DB:-natureza_vectors}
      - PGVECTOR_USER=${PGVECTOR_USER:-natureza}
      - PGVECTOR_PASSWORD=${PGVECTOR_PASSWORD:-natureza}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_MODEL=${EMBED_MODEL:-qwen3-embedding:0.6b}
      - EMBED_DIM=${EMBED_DIM:-1024}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-32}
    volumes:
      # The repository already carries the same 1,560-row reference CSV.
      - ./sql/data:/app/data:ro
    networks:
      - lab-network

volumes:
  ollama_data:
    name: homelab_slm_ollama_data
  postgres_data:
    name: homelab_slm_postgres_data
  n8n_data:
    name: homelab_slm_n8n_data
  pgvector_data:
    name: homelab_slm_pgvector_data

networks:
  lab-network:
    external: true
